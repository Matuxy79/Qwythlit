# Railway deployment configuration for the CLS RAG+CAG API.
#
# The ASGI application object lives in api.py and is re-exported by main.py so
# the platform's default `uvicorn main:app` contract resolves. Nixpacks detects
# requirements.txt automatically and installs the Python dependencies at build
# time; the start command below binds uvicorn to the port Railway injects.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# This service is the FastAPI bridge only. The Streamlit Full App and Chainlit
# Ask Lane stay local. After deploy: open /docs (not / until this revision is
# live), then POST /v1/ingest/default if health.indexed_chunks is 0.
# Persist the index with a volume + CLS_CHROMA_DIR=/data/chroma_store.