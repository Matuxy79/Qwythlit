[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name            = "jls-rag-cag"
version         = "1.3.0"
description     = "RAG+CAG information-retrieval chatbot for John's Light Source (JLS) synchrotron — discipline-scoped, built on Streamlit + ChromaDB."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "John Matukutiree" },
]

keywords = [
    "RAG",
    "CAG",
    "ChromaDB",
    "John's Light Source",
    "JLS",
    "synchrotron",
    "retrieval-augmented generation",
    "streamlit",
    "fastapi",
    "sentence-transformers",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies — mirrors requirements.txt exactly.
dependencies = [
    "streamlit",
    "chainlit",
    "fastapi",
    "uvicorn[standard]",
    "chromadb",
    "pandas",
    "pymupdf",
    "python-docx",
    "sentence-transformers",
]

[project.urls]
"Personal GitHub"       = "https://github.com/Matuxy79/The-ChromaDB"
"Bug Tracker"           = "https://github.com/Matuxy79/The-ChromaDB/issues"

# ---------------------------------------------------------------------------
# Package discovery — jls_backend/ and cls_backend/ (shim) are real importable packages;
# everything else (app.py, api.py, …) is top-level application scripts.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["jls_backend*", "cls_backend*"]

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts     = "-v --tb=short"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
